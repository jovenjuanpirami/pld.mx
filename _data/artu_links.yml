# Mapa tema/giro -> página de artu.ai. Lo usan el generador (ligas en el cuerpo de cada post),
# el CTA del final (post-cta.html, vía `artu_tema` en el front matter) y las ligas de los posts
# con más impresiones. Solo URLs del sitemap de artu.ai (https://artu.ai/sitemap.xml), todas
# revisadas con respuesta 200 el 23-nov-2026.
#
# claves: palabras (minúsculas y sin acentos) que se buscan en el título, el tema y las etiquetas;
#         gana el primer tema de la lista que coincida, así que los giros van antes que los temas generales.
# textos: textos de liga naturales; el generador rota entre ellos para no repetir siempre el mismo.
# giro:   etiqueta para el CTA ("Automatiza el cumplimiento PLD para ...").
default: actividades-vulnerables

