# Proveedores de software PLD para el ranking de PLD.mx (hub /top-software-pld/ y rankings por giro).
# REGLA: solo hechos que cada proveedor publica en su sitio oficial, con la URL y la cita que lo respaldan
# (verificados el 23-nov-2026). Nada de opiniones, precios, clientes o limitaciones que el proveedor no publique.
# cubre: true = lo publica; null = no lo publica (se muestra 'No lo publica'); texto = lo que publica tal cual.
# Revisión trimestral: actualizar actualizado y proxima_revision y volver a verificar cada fuente.
actualizado: '2026-11-23'
proxima_revision: '2027-02-23'
regla: Solo hechos que cada proveedor publica en su sitio oficial, con fuente y fecha. Sin opiniones, precios ni limitaciones inferidas.
criterios:
- nombre: Cobertura de la LFPIORPI
  detalle: 'cuántas obligaciones del artículo 18 resuelve: expediente, beneficiario controlador, riesgo, avisos y conservación.'
- nombre: Avisos listos para el SPPLD
  detalle: si genera avisos mensuales, por acumulación, de 24 horas e informes en ceros en el formato que pide el SAT.
- nombre: Evidencia y conservación
  detalle: si guarda búsquedas en listas, cambios de riesgo y documentos con fecha, y por cuántos años.
- nombre: Enfoque en actividades vulnerables
  detalle: si está pensada para las fracciones del artículo 17 o adaptada desde el sector financiero.
- nombre: Puesta en marcha y trabajo mensual
  detalle: cuánto tarda en operar con datos reales y cuánto trabajo deja al equipo cada mes.
