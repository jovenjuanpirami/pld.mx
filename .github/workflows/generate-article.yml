name: Generate Daily PLD Article

on:
  schedule:
    # Diario a las 8:00 AM de CDMX (14:00 UTC). El script decide: lunes, miércoles y viernes artículo
    # nuevo; martes y jueves actualiza uno de los posts con más impresiones (_data/top_posts.yml); fin de semana nada.
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      modo:
        description: 'nuevo | actualizar | vacío = según el día (L-M-V nuevo, M-J actualizar)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai pyyaml

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODO: ${{ github.event.inputs.modo }}
        run: python scripts/generate_article.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "PLD.mx Bot"
          git config user.email "bot@pld.mx"
          git add _posts/ assets/images/posts/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          CAMBIADO=$(git diff --staged --name-only -- _posts | head -1)
          TITLE=$(grep -m1 '^title:' "$CAMBIADO" | sed 's/^title: *"//;s/"$//')
          if git diff --staged --name-status -- _posts | grep -q '^A'; then ACCION="Nuevo artículo"; else ACCION="Actualización"; fi
          git commit -m "$ACCION: ${TITLE:-$DATE}"
          git push origin main
          echo "has_changes=true" >> $GITHUB_OUTPUT

    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}

  # Build and deploy site after new article is pushed
  build:
    # ubuntu-24.04 fijo: en ubuntu-latest (26.04) la acción setup-ruby no encuentra Ruby 3.1
    # precompilado y la compilación falla desde el 31-oct-2026.
    runs-on: ubuntu-24.04
    needs: generate
    if: needs.generate.outputs.has_changes == 'true'
    steps:
      - name: Checkout (with new article)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
