name: Compilar sitio (ramas)

# Compila el sitio en cada push a una rama que no sea main, sin publicar nada, y deja el _site como
# artefacto para revisarlo (H1, redirecciones, ligas). main se publica con jekyll.yml.
on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ubuntu-24.04 fijo: en ubuntu-latest (26.04) setup-ruby no encuentra Ruby 3.1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Subir el sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _site
          retention-days: 5
