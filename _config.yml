title: "PLD.mx - Prevención de Lavado de Dinero en México"
description: "Noticias, guías y recursos sobre Prevención de Lavado de Dinero (PLD), la LFPIORPI y cumplimiento regulatorio para empresas en México."
url: "https://pld.mx"
baseurl: ""
permalink: /:categories/:year/:month/:day/:title/

# SEO
lang: es-MX
author: "PLD.mx"
twitter:
  card: summary_large_image
logo: /assets/images/logo.svg

# Build
markdown: kramdown
highlighter: rouge
timezone: America/Mexico_City
future: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  categorias:
    output: true
    permalink: /categoria/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Equipo PLD.mx"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/

# Medición (se activa cada etiqueta al rellenar su clave)
google_analytics: ""        # GA4, p. ej. "G-XXXXXXXXXX"
meta_pixel: ""              # ID numérico del pixel de Meta
linkedin_partner_id: ""     # Partner ID del Insight Tag de LinkedIn
lead_form_endpoint: ""      # Endpoint POST del formulario (Formspree, Tally, HubSpot…)

# Enlaces de conversión
artu:
  site: https://artu.ai/
  demo: https://calendly.com/ceojuanpi/website-product-demo
  calculadora: https://artu.ai/calculadora-de-riesgo/
  aliados: https://artu.ai/aliados/conviertete-en-aliado/

podcast:
  name: "Artu Compliance Hero"
  spotify: https://open.spotify.com/show/0b1kTb4GP3lkHMQ8oXvx89
  rss: https://feeds.buzzsprout.com/2617719.rss
